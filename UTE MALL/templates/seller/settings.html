{% extends 'seller/base.html' %}{% block content %}<div class="seller-page-heading"><h1>Hồ sơ & Thiết lập Shop</h1><a class="btn" href="{{ url_for('shop_page',slug=seller_shop.slug) }}" target="_blank" rel="noopener">Xem gian hàng</a></div><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><section class="panel"><div class="panel-head"><h2>Thông tin Shop</h2><small>ID Shop: {{ seller_shop.id }}</small></div><div class="form-grid"><div class="field"><label>Tên Shop *</label><input class="input" name="name" value="{{ seller_shop.name }}" minlength="3" maxlength="150" required></div><div class="field"><label>Tỉnh / thành phố *</label><input class="input" name="location" value="{{ seller_shop.location }}" maxlength="120" required></div><div class="field full"><label>Giới thiệu Shop</label><textarea name="description" maxlength="2000">{{ seller_shop.description or '' }}</textarea></div><div class="field"><label>Email liên hệ</label><input class="input" type="email" name="contact_email" value="{{ seller_shop.contact_email or '' }}"></div><div class="field"><label>Số điện thoại</label><input class="input" name="phone" value="{{ seller_shop.phone or '' }}" maxlength="30"></div><div class="field full"><label>Địa chỉ lấy hàng</label><input class="input" name="shipping_address" value="{{ seller_shop.shipping_address or '' }}" maxlength="500"></div><div class="field"><label>URL ảnh đại diện</label><input class="input" name="logo_url" value="{{ seller_shop.logo_url or '' }}"><input type="file" name="logo_file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label>URL ảnh bìa</label><input class="input" name="cover_url" value="{{ seller_shop.cover_url or '' }}"><input type="file" name="cover_file" accept="image/png,image/jpeg,image/webp"></div></div><p><label><input type="checkbox" name="vacation_mode" {% if seller_shop.vacation_mode %}checked{% endif %}> Chế độ tạm nghỉ — tạm dừng nhận đơn mới của Shop</label></p><div class="form-actions"><button class="btn primary">Lưu thay đổi</button></div></section></form>{% endblock %}
