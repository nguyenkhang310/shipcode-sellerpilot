{% if pagination.pages>1 %}<nav class="pagination" aria-label="Phân trang">{% if pagination.has_prev %}<a href="{{ page_url(pagination.prev_num) }}">‹</a>{% endif %}{% for n in pagination.iter_pages(left_edge=1,right_edge=1,left_current=1,right_current=2) %}{% if n %}<a class="{% if n==pagination.page %}active{% endif %}" href="{{ page_url(n) }}">{{ n }}</a>{% else %}<span>…</span>{% endif %}{% endfor %}{% if pagination.has_next %}<a href="{{ page_url(pagination.next_num) }}">›</a>{% endif %}</nav>{% endif %}
