name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run test:auth
      - run: npm run test:extension
      - run: npm run build
      - run: npm run build:ios

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e '.[dev]'
      - run: python -m pytest
      - run: alembic upgrade head

  marketplace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UTE MALL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Prepare isolated API environment for app and marketplace sync tests
        run: |
          python -m venv ../backend/.venv
          ../backend/.venv/bin/python -m pip install -r ../backend/requirements-dev.lock
          ../backend/.venv/bin/python -m pip install --no-deps -e ../backend
      - name: Bootstrap a new demo with a random test-only password
        run: |
          python - <<'PY'
          import os, secrets, subprocess, sys
          env = dict(os.environ, DEMO_SELLER_PASSWORD=secrets.token_urlsafe(32))
          subprocess.run([sys.executable, 'bootstrap_demo.py'], env=env, check=True)
          PY
      - run: python tests/bootstrap_test.py
      - run: python tests/password_security_test.py
      - run: python bootstrap_demo.py --check
      - run: python -W ignore tests/commerce_test.py
      - run: python -W ignore tests/demo_reviews_test.py
